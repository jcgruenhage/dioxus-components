[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus-primitives = { path = "primitives" }
tracing = { version = "0.1", features = ["std"] }

dioxus = "0.7.8"
dioxus-rsx = "0.7.8"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
# TODO(@jcgruenhage): revert to `strip = true` once the board-render
# panic surfaced by the wasm preview is fixed — see the in-flight
# investigation tracked alongside the DragAndDropBoard work. Keeping
# panic messages and symbol names makes the playwright traces
# actionable in the meantime.
strip = false
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
