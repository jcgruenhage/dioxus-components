[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.80.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus.workspace = true
dioxus-attributes = { path = "../dioxus-attributes" }
dioxus-sdk-time = "0.7.0"
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"], optional = true }
jiff = { version = "0.2", optional = true }
num-integer = "0.1.46"
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"

[build-dependencies]
lazy-js-bundle = "0.7.9"

[dev-dependencies]
dioxus-ssr = "0.7.0"

[features]
default = ["router", "time"]
router = ["dioxus/router"]
# Umbrella for wasm wiring. Only the `time` backend needs a wasm-bindgen
# flip; `jiff` is wasm-clean out of the box, so `web` is a no-op for
# jiff-only builds (`--no-default-features --features "jiff,web"`).
web = ["time?/wasm-bindgen"]
time = ["dep:time"]
jiff = ["dep:jiff"]
